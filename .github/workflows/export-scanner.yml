name: Export scanner source

on:
  push:
    paths:
      - '.github/workflows/export-scanner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress scanner payload
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          chunks = sorted(Path('payload').glob('*.txt'))
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('scanner_source.py').write_text(source, encoding='utf-8')
          print('exported', len(source), 'chars')
          PY
      - name: Commit source
        run: |
          git config user.name "eve-bpc-bot"
          git config user.email "eve-bpc-bot@users.noreply.github.com"
          git add scanner_source.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: export scanner source for maintenance"
          git push
