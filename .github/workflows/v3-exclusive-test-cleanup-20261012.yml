name: V3 one-time exclusive trial cleanup 2026-10-12
on:
  push:
    paths:
      - '.github/workflows/v3-exclusive-test-cleanup-20261012.yml'
permissions:
  contents: read
  actions: write
jobs:
  stop-other-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel other EVE V3 workflow runs, preserve trial #38249511465
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 38249511465;
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listWorkflowRunsForRepo({owner, repo, per_page: 100});
            let cancelled = 0;
            for (const run of result.data.workflow_runs) {
              if (!run.name.startsWith('EVE V3 ')) continue;
              if (run.id === keep || run.id === context.runId) continue;
              if (!['queued', 'waiting', 'in_progress', 'requested', 'pending'].includes(run.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                core.info('Cancel requested EVE run: ' + run.id + ' (' + run.name + ')');
                cancelled++;
              } catch (err) {
                core.warning('Could not cancel run ' + run.id + ': ' + String(err.message));
              }
            }
            core.info('Other EVE scans cancellation requested: ' + cancelled + '; preserved trial: ' + keep);
