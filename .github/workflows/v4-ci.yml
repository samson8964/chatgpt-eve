name: V4 isolated test suite
on:
  push:
    branches: ['main', 'rebuild/v4-isolated-20261013']
    paths: ['v4/**', '.github/workflows/v4-ci.yml']
  pull_request:
    paths: ['v4/**', '.github/workflows/v4-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned V4 runtime dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m compileall -q v4
      - run: python -m unittest discover -s v4/tests -v
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '22'
      - if: matrix.python-version == '3.12'
        run: node --test v4/tests/test_v4_*.mjs
