name: Resend C-J6MT opportunity mail

on:
  push:
    paths:
      - '.github/workflows/resend-cj-mail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Resend C-J6MT SAFE digests only
        id: send
        continue-on-error: true
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_RECIPIENT_NAMES: MikeChong,LadyBaBa
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          STRUCTURE_MAIL_CHANNELS: cj-contract,cj-market
        shell: bash
        run: |
          python send_four_h_mail_multi.py 2>&1 | tee /tmp/cj-resend.log

      - name: Persist successful C-J mail states
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"
          git add results/state/mail_last_cj-* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No C-J mail state changes to persist."
            exit 0
          fi
          git commit -m "state: persist C-J6MT mail delivery"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Require resend success
        if: always()
        shell: bash
        run: |
          test "${{ steps.send.outcome }}" = "success" || {
            echo "::error::C-J6MT resend still has delivery failures."
            exit 1
          }
