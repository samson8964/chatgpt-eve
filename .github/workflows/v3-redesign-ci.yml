name: V3 redesign CI

on:
  push:
    branches:
      - 'v3-redesign-execution-proof-2026-10-07'
    paths:
      - 'opportunity_engine_v3.py'
      - 'opportunity_engine_v3_scanner.py'
      - 'send_v3_opportunity_mail.py'
      - 'v3_engine/**'
      - 'test_opportunity_engine_v3.py'
      - 'test_v3_engine_architecture.py'
      - '.github/workflows/v3-redesign-ci.yml'
  pull_request:
    paths:
      - 'opportunity_engine_v3.py'
      - 'opportunity_engine_v3_scanner.py'
      - 'send_v3_opportunity_mail.py'
      - 'v3_engine/**'
      - 'test_opportunity_engine_v3.py'
      - 'test_v3_engine_architecture.py'
      - '.github/workflows/v3-redesign-ci.yml'

permissions:
  contents: read

jobs:
  v3-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed V3
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependency
        run: python -m pip install requests

      - name: Compile V3 code
        run: |
          python -m py_compile opportunity_engine_v3.py opportunity_engine_v3_scanner.py send_v3_opportunity_mail.py
          python -m py_compile v3_engine/*.py

      - name: Run V3 unit tests
        run: python -m unittest test_opportunity_engine_v3.py test_v3_engine_architecture.py
