name: V4 complete public-market and contract deep shadow (no emails)
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  # First full shadow scan after successful V4 Store deploy. Scheduled scans
  # remain independent of code pushes and never trigger legacy workflows.
  workflow_run:
    workflows: ['Deploy Cloudflare V4 Store (shadow only)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eve-v4-complete-public-market
  cancel-in-progress: false
jobs:
  census:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce deployed V4 SQL store v3 protocol and release OFF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -fsS --retry 3 --retry-delay 3 \
            https://eve-v4-opportunity-store.99617224.workers.dev/health > /tmp/v4-store-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/v4-store-health.json',encoding='utf-8'))
          assert data.get('ok') and data.get('ledger_version',0)>=3, data
          assert data.get('dispatch_enabled') is False, data
          print('V4 store v3 SQL audit available; formal notifications OFF')
          PY
      - name: Install V4-only snapshot reader dependencies
        run: python -m pip install pandas requests
      - name: Fetch a NEW complete EVE Ref market and contracts snapshot and re-evaluate ALL location/type pairs
        run: python -m v4.full_scan
      - name: Resolve weekly bulk static catalog cache key
        id: catalog
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - name: Restore condensed static catalog
        uses: actions/cache@v4
        with:
          path: .cache/v4/reference
          key: v4-refdata-v1-${{ runner.os }}-${{ steps.catalog.outputs.week }}
      - name: Analyze fresh orders, authorized structures and contracts (SHADOW; no email)
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        run: python -m v4.deep_scan
      - name: Persist proof outcomes to Cloudflare V4 actor (release OFF)
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        run: python -m v4.ingest
      - name: Independently reconcile durable SQL UNIQUE proof count after all batches
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          report=json.loads(Path('v4_output/latest/deep_shadow.json').read_text(encoding='utf-8'))
          run_id=report['run_id']
          key=os.environ['EVE_MARKET_API_KEY']
          req=urllib.request.Request(
            'https://eve-v4-opportunity-store.99617224.workers.dev/api/v4/audit?run_id='+run_id,
            headers={'Authorization':'Bearer '+key,'User-Agent':'eve-v4-sql-proof-reconcile/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:audit=json.load(r)
          expected=int(report['proof_count'])
          actual=audit.get('sql_unique_proofs')
          statuses=audit.get('status_counts') or {}
          print('expected_proofs=',expected,'sql_unique_proofs=',actual,
                'stored_status_counts=',statuses)
          assert audit.get('ok') and audit.get('dispatch_enabled') is False,audit
          assert actual==expected, 'SQL_UNIQUE_PROOF_COUNT_MISMATCH'
          assert sum(statuses.values())==expected, 'SQL_STATUS_COUNT_MISMATCH'
          Path('v4_output/latest/sql_audit.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f v4_output/latest/full_market_report.json ]; then
            cat v4_output/latest/full_market_report.json
          fi
      - name: Save this run's fresh census report without touching Git state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-v4-census
          path: |
            v4_output/latest/full_market_report.json
            v4_output/latest/deep_shadow.json
            v4_output/latest/all_proofs.jsonl
            v4_output/latest/sql_audit.json
          retention-days: 14
          if-no-files-found: warn
