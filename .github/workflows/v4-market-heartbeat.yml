name: V4 complete public-market and contract deep shadow (no emails)
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  # First full shadow scan after successful V4 Store deploy. Scheduled scans
  # remain independent of code pushes and never trigger legacy workflows.
  workflow_run:
    workflows: ['Deploy Cloudflare V4 Store (shadow only)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eve-v4-complete-public-market
  cancel-in-progress: false
jobs:
  census:
    # Temporary emergency preservation mode: ALL proofs go to artifact;
    # SQL writes are paused until sustainable long-term storage is available.
    env:
      V4_SQL_WRITE_MODE: 'paused_free_tier'
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated V4 deployment release OFF, without hitting exhausted SQL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -fsS --retry 3 --retry-delay 3 \
            https://eve-v4-opportunity-store.99617224.workers.dev/status > /tmp/v4-store-status.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v4-store-status.json',encoding='utf-8'))
          assert d.get('ok') and d.get('ledger_protocol',0)>=4,d
          assert d.get('service')=='eve-v4-opportunity-store',d
          assert d.get('dispatch_enabled') is False,d
          assert d.get('durable_sql_status')=='NOT_CHECKED',d
          print('::warning::V4 Store release OFF, SQL unverified due write quota; artifact-only shadow mode')
          PY
      - name: Install V4-only snapshot reader dependencies
        run: python -m pip install pandas requests
      - name: Fetch a NEW complete EVE Ref market and contracts snapshot and re-evaluate ALL location/type pairs
        run: python -m v4.full_scan
      - name: Resolve weekly bulk static catalog cache key
        id: catalog
        run: echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
      - name: Restore condensed static catalog
        uses: actions/cache@v4
        with:
          path: .cache/v4/reference
          key: v4-refdata-v1-${{ runner.os }}-${{ steps.catalog.outputs.week }}
      - name: Analyze fresh orders, authorized structures and contracts (SHADOW; no email)
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        run: python -m v4.deep_scan
      - name: Persist proof outcomes to Cloudflare V4 actor (release OFF)
        if: env.V4_SQL_WRITE_MODE == 'enabled'
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        run: python -m v4.ingest
      - name: Independently reconcile durable SQL UNIQUE proof count after all batches
        if: env.V4_SQL_WRITE_MODE == 'enabled'
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          report=json.loads(Path('v4_output/latest/deep_shadow.json').read_text(encoding='utf-8'))
          run_id=report['run_id']
          key=os.environ['EVE_MARKET_API_KEY']
          req=urllib.request.Request(
            'https://eve-v4-opportunity-store.99617224.workers.dev/api/v4/audit?run_id='+run_id,
            headers={'Authorization':'Bearer '+key,'User-Agent':'eve-v4-sql-proof-reconcile/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:audit=json.load(r)
          expected=int(report['proof_count'])
          actual=audit.get('sql_unique_proofs')
          statuses=audit.get('status_counts') or {}
          print('expected_proofs=',expected,'sql_unique_proofs=',actual,
                'stored_status_counts=',statuses)
          assert audit.get('ok') and audit.get('dispatch_enabled') is False,audit
          assert actual==expected, 'SQL_UNIQUE_PROOF_COUNT_MISMATCH'
          assert sum(statuses.values())==expected, 'SQL_STATUS_COUNT_MISMATCH'
          Path('v4_output/latest/sql_audit.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Preserve every SHADOW proof as an auditable artifact while SQL quota is exhausted
        if: env.V4_SQL_WRITE_MODE != 'enabled'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('v4_output/latest')
          report=json.loads((base/'deep_shadow.json').read_text(encoding='utf-8'))
          proofs=base/'all_proofs.jsonl'
          assert proofs.is_file() and proofs.stat().st_size>0
          count=sum(1 for line in proofs.open(encoding='utf-8') if line.strip())
          assert count==int(report['proof_count']), (count,report['proof_count'])
          gate={'status':'PENDING_SQL_QUOTA','run_id':report['run_id'],
                'expected_proofs':count,'sql_unique_proofs':None,
                'reason':'DURABLE_OBJECT_FREE_ROWS_WRITTEN_QUOTA_EXCEEDED',
                'release_enabled':False,'all_proofs_artifact':True,
                'durable_ledger_accepted':False}
          (base/'sql_audit.json').write_text(json.dumps(gate,indent=2),encoding='utf-8')
          print('::warning::V4 SQL write temporarily paused; proof_count='+str(count)+
                ' artifact saved; durable ledger NOT accepted, no mail')
          PY
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f v4_output/latest/full_market_report.json ]; then
            cat v4_output/latest/full_market_report.json
          fi
      - name: Save this run's fresh census report without touching Git state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-v4-census
          path: |
            v4_output/latest/full_market_report.json
            v4_output/latest/deep_shadow.json
            v4_output/latest/all_proofs.jsonl
            v4_output/latest/sql_audit.json
          retention-days: 14
          if-no-files-found: warn
