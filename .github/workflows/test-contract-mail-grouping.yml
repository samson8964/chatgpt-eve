name: Test contract mail grouping

on:
  push:
    paths:
      - '.github/workflows/test-contract-mail-grouping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Render C-J contract mail without sending
        shell: bash
        run: |
          python - <<'PY'
          import send_four_h_mail_multi as m
          picked = m.build_candidates("cj-contract")
          plan = {
              "mode":"initial",
              "added":[dict(x, change_kind="新增") for x in picked],
              "changed":[],
              "removed":[],
              "current":picked,
          }
          subject, body = m.render_notification("cj-contract", "TEST", plan)
          print(subject)
          print(body)
          assert "TOP1组/5份" in subject, subject
          assert body.count("GSF - Vulture") == 1, body
          assert "同类合同 ×5" in body, body
          assert body.count("打开合同") == 5, body
          print("GROUPING_TEST_OK")
          PY
