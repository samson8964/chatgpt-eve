name: EVE mail test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mail-test.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Send direct test mail to MikeChong
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
        run: |
          python - <<'PY'
          import os
          import requests

          name = "MikeChong"
          ids = requests.post(
              "https://esi.evetech.net/latest/universe/ids/?datasource=tranquility",
              json=[name],
              timeout=20,
          )
          print("resolve:", ids.status_code, ids.text)
          ids.raise_for_status()
          chars = ids.json().get("characters", [])
          if not chars:
              raise RuntimeError(f"Character not found: {name}")
          recipient_id = int(chars[0]["id"])

          api_key = os.environ.get("EVE_MAIL_API_KEY", "")
          if not api_key:
              raise RuntimeError("GitHub secret EVE_MAIL_API_KEY is missing")

          worker = os.environ["EVE_MAIL_WORKER_URL"].rstrip("/")
          payload = {
              "recipient_id": recipient_id,
              "subject": "EVE套利推送链路测试",
              "body": "<b>EVE BPC 套利推送测试成功</b><br><br>如果你看到这封邮件，说明 GitHub → Cloudflare Worker → EVE Mail → MikeChong 整条链路已经打通。",
              "idempotency_key": f"mail-test-{os.environ.get('GITHUB_RUN_ID','manual')}",
          }
          resp = requests.post(
              worker + "/api/send-mail",
              headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
              json=payload,
              timeout=30,
          )
          print("worker:", resp.status_code, resp.text)
          resp.raise_for_status()
          PY
