name: V4 Reliability CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v4/**'
      - 'cloudflare/**'
      - '.github/workflows/reliability-ci.yml'
      - '.github/workflows/v4-ci.yml'
      - '.github/workflows/v4-market-heartbeat.yml'
      - '.github/workflows/retire-v3.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent V4 sources
        run: python -m compileall -q v4
      - name: Verify V4 opportunity identity and policy regression tests
        run: python -m unittest discover -s v4/tests -v
      - name: Assert legacy V3 jobs are retired and no Worker schedule can dispatch them
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          worker=Path('cloudflare/worker_mail_sender.js').read_text()
          wrangler=json.loads(Path('cloudflare/wrangler.jsonc').read_text())
          assert wrangler.get('triggers',{}).get('crons') == [], 'legacy Cloudflare Cron revived'
          assert 'dispatchGitHubWorkflow(' not in worker, 'legacy GH dispatcher revived'
          assert 'scheduler_enabled: false' in worker, 'scheduler health not disabled'
          for name in ['scan.yml','v3-bpc-deep.yml','v3-dc-o4t.yml','booster-monitor.yml','v3-market-reliability-ci.yml']:
              content=Path('.github/workflows', name).read_text()
              assert 'schedule:' not in content and 'push:' not in content, name
              assert 'if: ${{ false }}' in content, name
          heartbeat=Path('.github/workflows/v4-market-heartbeat.yml').read_text()
          assert 'v4.full_scan' in heartbeat and "schedule:" in heartbeat
          print('Legacy V3 automation retired; V4 full public market heartbeat retained')
          PY
      - name: Check Worker JavaScript syntax
        run: |
          node --check cloudflare/worker.js
          node --check cloudflare/worker_mail_sender.js
          node --check cloudflare/v4_store.js
          node --check cloudflare/v4_api_worker.js
      - name: Validate both Worker bundles without deploying
        run: |
          npx --yes wrangler@latest deploy --config cloudflare/wrangler.jsonc --strict --dry-run
          npx --yes wrangler@latest deploy --config cloudflare/wrangler.v4-store.jsonc --strict --dry-run
