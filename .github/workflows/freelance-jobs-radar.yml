name: Freelance Jobs Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "freelance_job_scanner.py"
      - ".github/workflows/freelance-jobs-radar.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Scan public Freelance Jobs
        run: python freelance_job_scanner.py --top 10
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: freelance-jobs-scan
          path: artifacts/
          if-no-files-found: error
