name: V4 D1 capability preflight
on:
  push:
    branches: ['rebuild/v4-isolated-20261013']
    paths: ['.github/workflows/v4-d1-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify D1 list permissions without modifying resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest d1 list --json > /tmp/v4-d1-list.json
          python - <<'PY'
          import json
          dbs=json.load(open('/tmp/v4-d1-list.json'))
          print('Cloudflare D1 API accessible:', isinstance(dbs,list))
          print('Existing V4 D1 available:', any(str(x.get('name','')).startswith('eve-v4') for x in dbs))
          PY
