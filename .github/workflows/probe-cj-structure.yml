name: Probe C-J6MT structure id

on:
  push:
    paths:
      - '.github/workflows/probe-cj-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current worker access to C-J6MT
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          structure_id = 1049588174021
          url = "https://eve-contract-opener.99617224.workers.dev/api/structure-market?" + urllib.parse.urlencode({
              "structure_id": structure_id,
              "page": 1,
          })
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["EVE_MARKET_API_KEY"],
                  "Accept": "application/json",
                  "User-Agent": "chatgpt-eve-cj-access-probe/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  status = r.status
                  data = json.load(r)
          except urllib.error.HTTPError as exc:
              status = exc.code
              raw = exc.read().decode("utf-8", "replace")
              print(f"HTTP={status}")
              print(raw[:1000])
              raise SystemExit(1)

          print(f"HTTP={status}")
          print(f"OK={bool(data.get('ok'))}")
          print(f"STRUCTURE_ID={data.get('structure_id')}")
          print(f"PAGES={data.get('pages')}")
          print(f"PAGE1_ORDERS={len(data.get('orders') or [])}")
          print(f"EXPIRES={data.get('expires')}")
          if status != 200 or not data.get("ok"):
              raise SystemExit(1)
          PY
