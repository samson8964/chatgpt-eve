name: Probe EVE recipient names

on:
  push:
    paths:
      - '.github/workflows/probe-cj-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve EVE mail recipients
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          names = ["MikeChong", "LadyBaBa"]
          req = urllib.request.Request(
              "https://esi.evetech.net/latest/universe/ids/?datasource=tranquility",
              data=json.dumps(names).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          chars = {str(x.get("name", "")).casefold(): x for x in (data.get("characters") or [])}
          for name in names:
              row = chars.get(name.casefold())
              if not row:
                  raise SystemExit(f"NOT_FOUND={name}")
              print(f"RESOLVED={name}:{row['id']}")
          PY
