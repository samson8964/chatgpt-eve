name: Retire all V3 production scans
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/wrangler.jsonc'
      - 'cloudflare/worker_mail_sender.js'
      - '.github/workflows/retire-v3.yml'
permissions:
  contents: read
  actions: write
jobs:
  disable-old:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cancel in-flight legacy jobs, disable V3/booster workflows by GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          repo=os.environ["GH_REPO"]
          token=os.environ["GH_TOKEN"]
          old=["scan.yml","v3-bpc-deep.yml","v3-dc-o4t.yml","booster-monitor.yml","v3-market-reliability-ci.yml","v3-redesign-ci.yml","v3-validation.yml","v3-shadow-validation.yml","bpc-v2-trial.yml","v2-mail-gate-test.yml","opportunity-engine-v2-test.yml"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"eve-v4-cutover/1.0","X-GitHub-Api-Version":"2022-11-28"}
          def api(method,path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read()
                      return r.status,json.loads(data) if data else {}
              except urllib.error.HTTPError as e:
                  msg=e.read().decode("utf-8",errors="replace")[:220]
                  return e.code,{"message":msg}
          errors=[]
          for name in old:
              wf="/actions/workflows/"+name
              st,data=api("GET",wf)
              print("workflow",name,"state",data.get("state"),"HTTP",st)
              if st!=200:
                  errors.append((name,"lookup",st))
                  continue
              for status in ("in_progress","queued","waiting","pending"):
                  code,logs=api("GET",wf+"/runs?status="+status+"&per_page=100")
                  if code!=200:
                      errors.append((name,"runs_"+status,code))
                      continue
                  for run in logs.get("workflow_runs",[]):
                      run_id=int(run["id"])
                      c,p=api("POST","/actions/runs/"+str(run_id)+"/cancel")
                      print("cancel",name,run_id,c)
                      if c not in (202,409):
                          errors.append((name,run_id,c))
              code,result=api("PUT",wf+"/disable")
              print("disable",name,code)
              if code!=204: errors.append((name,"disable",code))
          if errors:
              raise SystemExit("V3 retirement verification failed: "+repr(errors))
          print("All V3 and legacy booster scheduled workflows disabled.")
          PY
