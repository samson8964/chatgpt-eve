name: Inspect used crystal raw rows

on:
  push:
    branches:
      - fix-market-ineligible-singletons
    paths:
      - '.github/workflows/inspect-used-crystal.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect contract 236253300
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from scanner_source import PUBLIC_CONTRACTS_INDEX, DATA, latest_file, download, load_contracts
          target=236253300
          url,_=latest_file(PUBLIC_CONTRACTS_INDEX)
          p=DATA/Path(url).name
          if not p.exists(): download(url,p)
          _,items=load_contracts(p)
          items["contract_id"]=pd.to_numeric(items["contract_id"],errors="coerce").astype("Int64")
          g=items[items["contract_id"]==target].copy()
          print("COLUMNS", list(g.columns))
          print("ROWS",len(g))
          cols=[x for x in ["record_id","item_id","type_id","quantity","is_included","is_singleton","singleton","is_blueprint_copy"] if x in g.columns]
          print(g[cols].head(50).to_string(index=False))
          if not g.empty:
              print(g.groupby("type_id").agg(row_count=("quantity","size"),qty_sum=("quantity","sum"),qty_min=("quantity","min"),qty_max=("quantity","max")).sort_values(["row_count","qty_sum"],ascending=False).head(80).to_string())
          PY
