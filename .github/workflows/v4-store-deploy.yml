name: Deploy Cloudflare V4 Store (shadow only)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/v4_store.js'
      - 'cloudflare/v4_api_worker.js'
      - 'cloudflare/wrangler.v4-store.jsonc'
      - '.github/workflows/v4-store-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eve-v4-store-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
      WORKER_URL: https://eve-v4-opportunity-store.99617224.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify this deploy cannot enable notifications or migrate existing data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          j=json.load(open('cloudflare/wrangler.v4-store.jsonc',encoding='utf-8'))
          assert j['name']=='eve-v4-opportunity-store'
          assert j['vars']['V4_RELEASE_ENABLED']=='0'
          assert j['durable_objects']['bindings'][0]['class_name']=='V4OpportunityLedger'
          assert j['migrations'][0]['tag']=='v4-store-init'
          print('shadow-release=OFF; existing Durable Object class/migration retained')
          PY
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 2
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || exit 2
          test -n "${EVE_MAIL_API_KEY:-}" || exit 2
      - name: Validate Cloudflare build without deploying
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.v4-store.jsonc --strict --dry-run
      - name: Deploy ONLY isolated V4 SQLite store
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.v4-store.jsonc --strict
      - name: Preserve configured V4 authenticated API access
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EVE_MAIL_API_KEY" | npx --yes wrangler@latest secret put V4_API_KEY --config cloudflare/wrangler.v4-store.jsonc
      - name: Verify deployment; distinguish SQL quota-block from true database audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,time
          base=os.environ['WORKER_URL']
          def get_json(path,token=None):
              args=['curl','-sS','--max-time','25','-w','__HTTP_STATUS__=%{http_code}',
                    '-H','User-Agent: eve-v4-ledger-quota-check/1.0']
              if token:args.extend(['-H','Authorization: Bearer '+token])
              args.append(base+path)
              p=subprocess.run(args,text=True,capture_output=True,timeout=35)
              body,sep,status=p.stdout.rpartition('__HTTP_STATUS__=')
              if not sep:raise RuntimeError('HTTP_PROBE_NO_STATUS:'+p.stderr[:100])
              if status!='200' or p.returncode!=0:
                  print('probe_error',path.split('?')[0],status,body[:350])
                  if 'Exceeded allowed rows written in Durable Objects free tier' in body:
                      raise RuntimeError('SQL_FREE_DAILY_WRITE_QUOTA_EXHAUSTED')
                  raise RuntimeError('V4_STORE_HTTP_'+status)
              return json.loads(body)
          # workers.dev can temporarily serve the previous version after a deploy.
          # Only accept a verified v4 protocol; bounded propagation retries never
          # excuse a persistently wrong script or unauthorized deployment.
          status=None
          for attempt in range(10):
              try:
                  status=get_json('/status')
                  if status.get('ledger_protocol',0)>=4:break
              except RuntimeError:
                  if attempt==9:raise
              print('V4_STORE_PROPAGATION_RETRY',attempt)
              time.sleep(5)
          assert status and status.get('ok') and status.get('service')=='eve-v4-opportunity-store',status
          assert status.get('ledger_protocol',0)>=4,status
          assert status.get('dispatch_enabled') is False,status
          assert status.get('durable_sql_status')=='NOT_CHECKED',status
          key=os.environ['EVE_MAIL_API_KEY']
          historic='v4-ff78ed60600a40e487e78e47ac349836'
          quota_block=False
          health=None
          for attempt in range(3):
              try:
                  health=get_json('/health',key)
                  break
              except RuntimeError as e:
                  if str(e)=='SQL_FREE_DAILY_WRITE_QUOTA_EXHAUSTED':
                      quota_block=True;break
                  if attempt==2:raise
                  time.sleep(4)
          # When shadow explicitly operates in artifact-only mode, do not
          # access the SQL API at all: it can itself throw after a Free daily
          # quota limit. This is NOT evidence that historic SQL rows match.
          workflow=open('.github/workflows/v4-market-heartbeat.yml',encoding='utf-8').read()
          if "V4_SQL_WRITE_MODE: 'paused_free_tier'" in workflow:
              print('::warning::SQL audit DEFERRED: current workflow intentionally pauses database ingest')
              quota_block=True
          if quota_block:
              report={'run_id':historic,'status':'PENDING_SQL_QUOTA',
                      'expected_proofs':32860,'sql_unique_proofs':None,
                      'release_enabled':False,
                      'reason':'SQL_AUDIT_DEFERRED_DURING_ARTIFACT_ONLY_MODE'}
              print('::warning::V4 SQL quota exhausted; no historical row-count claim. V4 scan allowed in artifact-only mode.')
          else:
              assert health and health.get('ok') and health.get('ledger_version',0)>=4,health
              assert health.get('dispatch_enabled') is False,health
              report=get_json('/api/v4/audit?run_id='+historic,key)
              assert report.get('ok') and report.get('run_id')==historic,report
              assert report.get('dispatch_enabled') is False,report
              print('historical_sql_unique_proofs=',report.get('sql_unique_proofs'))
              print('historical_status_counts=',report.get('status_counts'))
              assert report.get('sql_unique_proofs')==32860,'HISTORIC_SQL_UNIQUE_COUNT_DISCREPANCY'
              print('historical_sql_independent_audit=VERIFIED')
          with open('v4_store_audit.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('V4 Store release OFF; SQL audit status: '+str(report.get('status','VERIFIED'))+
                      '; unique rows: '+str(report.get('sql_unique_proofs'))+chr(10))
          PY
      - name: Save independently checked V4 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-store-sql-audit
          path: v4_store_audit.json
          if-no-files-found: ignore
          retention-days: 14
