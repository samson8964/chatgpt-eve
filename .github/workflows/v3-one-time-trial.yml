name: V3 one-time trial push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v3-one-time-trial.yml'

permissions:
  contents: read

concurrency:
  group: eve-v3-one-time-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V3 unit tests
        run: python -m unittest -v test_opportunity_engine_v3.py

      - name: Verify LadyGuaGua mail sender health
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
        run: |
          python - <<'PY'
          import os, requests
          worker=os.environ['EVE_MAIL_WORKER_URL'].rstrip('/')
          key=os.environ['EVE_MAIL_API_KEY']
          r=requests.get(worker+'/api/mail-health',headers={'Authorization':f'Bearer {key}'},timeout=30)
          r.raise_for_status()
          data=r.json()
          assert data.get('ok') is True, data
          assert data.get('sender_name') == 'LadyGuaGua', data
          print('mail health OK; sender=LadyGuaGua')
          PY

      - name: Run V3 public-contract discovery
        env:
          DEAL_MIN_CONTRACT_PRICE: '1000000'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          DEAL_MIN_HOURS_TO_EXPIRE: '0.5'
          DEAL_SKIN_MAJOR_SHARE: '0.50'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
          V3_PUBLIC_LIVE_LIMIT: '300'
          V3_PUBLIC_PER_METRIC: '110'
          V3_PUBLIC_NEWEST_COUNT: '60'
          V3_LIST_HISTORY_LIMIT: '120'
        run: python opportunity_engine_v3_scanner.py

      - name: Run V3 Jita to 4-H reverse scan
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          FOUR_H_STRUCTURE_ID: '1053970513596'
          V3_4H_REVERSE_MIN_PROFIT: '20000000'
          V3_4H_REVERSE_MIN_ROI: '0.10'
          V3_4H_REVERSE_HAUL_BASE: '10000000'
          V3_4H_REVERSE_HAUL_ISK_PER_M3: '500'
        run: python four_h_reverse_scanner_v3.py

      - name: Show V3 SAFE candidates before mail
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=[
            'v3_cash_floor.csv',
            'v3_barter.csv',
            'v3_conservative_listing.csv',
            'v3_jita_to_four_h.csv',
          ]
          total=0
          for name in files:
              p=Path('results/latest')/name
              try: df=pd.read_csv(p)
              except Exception: df=pd.DataFrame()
              if not df.empty and 'execution_status' in df:
                  safe=df[df['execution_status'].fillna('').astype(str).str.upper().eq('SAFE')].copy()
              else:
                  safe=pd.DataFrame()
              total += len(safe)
              print(f'{name}: rows={len(df)} SAFE={len(safe)}')
              if not safe.empty:
                  cols=[c for c in ['channel','contract_id','type_id','item_name','net_profit','net_roi','stress_net_profit','score_grade'] if c in safe.columns]
                  print(safe[cols].head(10).to_string(index=False))
          print(f'TOTAL_SAFE={total}')
          PY

      - name: Send one-time V3 SAFE trial mail
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_RECIPIENT_NAMES: 'MikeChong,Vektor Yang'
          MAIL_TOP: '10'
        run: python send_v3_opportunity_mail.py

      - name: Upload trial outputs
        uses: actions/upload-artifact@v4
        with:
          name: v3-one-time-trial
          path: |
            results/latest/v3_*.csv
            results/latest/v3_*.md
          if-no-files-found: error
          retention-days: 7
