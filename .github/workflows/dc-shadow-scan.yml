name: EVE DC shadow scan
# verification-bump: 2026-10-10-after-dc-auth

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dc-shadow-scan.yml'
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write

concurrency:
  group: eve-dc-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
      EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
      MAIL_MIN_VERIFIED_NET_PROFIT: '50000000'
      MIN_PROFIT_PER_M3: '2000'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve DC structures and verify LadyBaBa access
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests

          base=os.environ["EVE_MARKET_WORKER_URL"].rstrip("/")
          key=os.environ["EVE_MARKET_API_KEY"]
          headers={"Authorization": f"Bearer {key}", "Accept":"application/json"}
          targets={"tcag":"TCAG-3","o4t":"O4T-Z5"}
          resolved={}
          auth_required=False

          for k,q in targets.items():
              r=requests.get(f"{base}/api/structure-search",
                             params={"q":q,"auth_profile":"dc"},
                             headers=headers,timeout=45)
              try: data=r.json()
              except Exception: data={"detail":r.text[:500]}
              if r.status_code in (401,403):
                  print(f"{k}: DC auth required or scope/access missing: HTTP {r.status_code} {data}")
                  auth_required=True
                  continue
              r.raise_for_status()
              rows=data.get("structures") or []
              print(f"{k}: discovery search_status={data.get('search_status')} direct_ids={data.get('direct_search_ids')} candidates={data.get('candidate_count')} market_accessible={len(rows)}")
              exact=[x for x in rows if q.lower() in str(x.get("name","")).lower()]
              prime=[x for x in rows if "dracarys" in str(x.get("name","")).lower() and "prime" in str(x.get("name","")).lower()]
              chosen=(exact or prime or rows)
              if not chosen:
                  print(f"{k}: no market-accessible structure candidates found for {q}")
                  continue
              chosen=chosen[0]
              if not (exact or prime):
                  print(f"{k}: structure name unavailable; using highest-volume market-accessible candidate {chosen}")
              sid=int(chosen["structure_id"])
              mr=requests.get(f"{base}/api/structure-market",
                              params={"structure_id":sid,"page":1,"auth_profile":"dc"},
                              headers=headers,timeout=60)
              try: md=mr.json()
              except Exception: md={"detail":mr.text[:500]}
              if mr.status_code != 200 or not md.get("ok"):
                  print(f"{k}: structure resolved but market access failed: HTTP {mr.status_code} {md}")
                  continue
              resolved[k]={
                  "id":sid,
                  "name":chosen.get("name",""),
                  "system_id":chosen.get("solar_system_id",0),
                  "pages":int(md.get("pages") or 1),
                  "page1_orders":len(md.get("orders") or []),
              }
              print(f"{k}: {resolved[k]}")

          ready=all(k in resolved for k in targets)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"auth_required={'true' if auth_required else 'false'}\n")
              for k,v in resolved.items():
                  f.write(f"{k}_id={v['id']}\n")
                  f.write(f"{k}_name={v['name']}\n")
                  f.write(f"{k}_pages={v['pages']}\n")

          os.makedirs("results/latest",exist_ok=True)
          with open("results/latest/shadow_dc_access.json","w",encoding="utf-8") as f:
              json.dump({"ready":ready,"auth_required":auth_required,"resolved":resolved},f,ensure_ascii=False,indent=2)
          PY

      - name: Report authorization wait state
        if: steps.resolve.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## DC shadow scan waiting for access"
            echo ""
            echo "- DC auth/access not ready; no production scan or mail was affected."
            echo "- Authorize the DC profile with LadyBaBa at: https://eve-contract-opener.99617224.workers.dev/auth-dc"
            echo "- The scheduled shadow workflow will retry automatically every 2 hours."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan TCAG-3 market to Jita
        if: steps.resolve.outputs.ready == 'true'
        env:
          V3_SOURCE_KIND: structure
          V3_SOURCE_KEY: dc_tcag
          V3_SOURCE_LABEL: "${{ steps.resolve.outputs.tcag_name }}"
          SOURCE_STRUCTURE_ID: "${{ steps.resolve.outputs.tcag_id }}"
          SOURCE_MARKET_KEY: dc_tcag
          SOURCE_MARKET_LABEL: "${{ steps.resolve.outputs.tcag_name }}"
          SOURCE_AUTH_PROFILE: dc
          V3_SOURCE_PREFILTER_MIN_PROFIT: '2000000'
          V3_SOURCE_PREFILTER_MIN_ROI: '0.02'
          V3_SOURCE_LIVE_LIMIT: '240'
          V3_SOURCE_TOP: '200'
          V3_SOURCE_HAUL_BASE: '5000000'
          V3_SOURCE_HAUL_ISK_PER_M3: '1250'
          V3_SOURCE_HAUL_ISK_PER_M3_JUMP: '0'
          V3_SOURCE_RESULT_CSV: 'shadow_dc_tcag_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'shadow_dc_tcag_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'shadow_dc_tcag_to_jita_funnel.json'
        run: python v3_source_market_scanner.py

      - name: Scan O4T-Z5 market to Jita
        if: steps.resolve.outputs.ready == 'true'
        env:
          V3_SOURCE_KIND: structure
          V3_SOURCE_KEY: dc_o4t
          V3_SOURCE_LABEL: "${{ steps.resolve.outputs.o4t_name }}"
          SOURCE_STRUCTURE_ID: "${{ steps.resolve.outputs.o4t_id }}"
          SOURCE_MARKET_KEY: dc_o4t
          SOURCE_MARKET_LABEL: "${{ steps.resolve.outputs.o4t_name }}"
          SOURCE_AUTH_PROFILE: dc
          V3_SOURCE_PREFILTER_MIN_PROFIT: '2000000'
          V3_SOURCE_PREFILTER_MIN_ROI: '0.02'
          V3_SOURCE_LIVE_LIMIT: '240'
          V3_SOURCE_TOP: '200'
          V3_SOURCE_HAUL_BASE: '5000000'
          V3_SOURCE_HAUL_ISK_PER_M3: '1250'
          V3_SOURCE_HAUL_ISK_PER_M3_JUMP: '0'
          V3_SOURCE_RESULT_CSV: 'shadow_dc_o4t_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'shadow_dc_o4t_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'shadow_dc_o4t_to_jita_funnel.json'
        run: python v3_source_market_scanner.py

      - name: Scan TCAG-3 contracts
        if: steps.resolve.outputs.ready == 'true'
        env:
          SOURCE_STRUCTURE_ID: "${{ steps.resolve.outputs.tcag_id }}"
          SOURCE_LABEL: "${{ steps.resolve.outputs.tcag_name }}"
          SOURCE_AUTH_PROFILE: dc
          V3_STRUCTURE_KEY: dc_tcag
          SOURCE_CONTRACT_MIN_PRICE: '1000000'
          SOURCE_CONTRACT_MAX_PRICE: '5000000000'
          V3_STRUCTURE_CONTRACT_LIVE_LIMIT: '220'
          V3_STRUCTURE_CONTRACT_TOP: '180'
          V3_STRUCTURE_HAUL_BASE: '5000000'
          V3_STRUCTURE_HAUL_ISK_PER_M3: '1250'
          V3_STRUCTURE_CONTRACT_RESULT_CSV: 'shadow_dc_tcag_contracts.csv'
          V3_STRUCTURE_CONTRACT_REPORT_MD: 'shadow_dc_tcag_contracts.md'
          V3_STRUCTURE_CONTRACT_FUNNEL_JSON: 'shadow_dc_tcag_contracts_funnel.json'
        run: python v3_structure_contract_scanner.py

      - name: Scan O4T-Z5 contracts
        if: steps.resolve.outputs.ready == 'true'
        env:
          SOURCE_STRUCTURE_ID: "${{ steps.resolve.outputs.o4t_id }}"
          SOURCE_LABEL: "${{ steps.resolve.outputs.o4t_name }}"
          SOURCE_AUTH_PROFILE: dc
          V3_STRUCTURE_KEY: dc_o4t
          SOURCE_CONTRACT_MIN_PRICE: '1000000'
          SOURCE_CONTRACT_MAX_PRICE: '5000000000'
          V3_STRUCTURE_CONTRACT_LIVE_LIMIT: '220'
          V3_STRUCTURE_CONTRACT_TOP: '180'
          V3_STRUCTURE_HAUL_BASE: '5000000'
          V3_STRUCTURE_HAUL_ISK_PER_M3: '1250'
          V3_STRUCTURE_CONTRACT_RESULT_CSV: 'shadow_dc_o4t_contracts.csv'
          V3_STRUCTURE_CONTRACT_REPORT_MD: 'shadow_dc_o4t_contracts.md'
          V3_STRUCTURE_CONTRACT_FUNNEL_JSON: 'shadow_dc_o4t_contracts_funnel.json'
        run: python v3_structure_contract_scanner.py

      - name: Append DC shadow metrics
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        env:
          TCAG_ID: "${{ steps.resolve.outputs.tcag_id }}"
          O4T_ID: "${{ steps.resolve.outputs.o4t_id }}"
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timezone
          import pandas as pd

          out="results/state/dc_shadow_history.csv"
          os.makedirs(os.path.dirname(out),exist_ok=True)
          now=datetime.now(timezone.utc).isoformat()

          def funnel(path):
              try: return json.load(open(path,encoding="utf-8")).get("stages",{})
              except Exception: return {}

          def metrics(path):
              try: df=pd.read_csv(path)
              except Exception: return {"rows":0,"mail":0,"max_profit":0.0,"median_profit":0.0}
              if df.empty: return {"rows":0,"mail":0,"max_profit":0.0,"median_profit":0.0}
              p=pd.to_numeric(df.get("net_profit",pd.Series(dtype=float)),errors="coerce").dropna()
              m=df.get("mail_eligible",pd.Series(dtype=object)).astype(str).str.lower().isin(["true","1","yes"]).sum()
              return {"rows":len(df),"mail":int(m),
                      "max_profit":float(p.max()) if len(p) else 0.0,
                      "median_profit":float(p.median()) if len(p) else 0.0}

          configs=[
              ("TCAG-3",os.environ["TCAG_ID"],"shadow_dc_tcag"),
              ("O4T-Z5",os.environ["O4T_ID"],"shadow_dc_o4t"),
          ]
          fields=["ts_utc","station","structure_id","source_sell_types","market_prefilter","market_rows","market_mail","market_max_profit","market_median_profit","active_contracts","plain_contracts","contract_rows","contract_mail","contract_max_profit","contract_median_profit"]
          exists=os.path.exists(out)
          with open(out,"a",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields)
              if not exists: w.writeheader()
              for station,sid,prefix in configs:
                  mf=funnel(f"results/latest/{prefix}_to_jita_funnel.json")
                  cf=funnel(f"results/latest/{prefix}_contracts_funnel.json")
                  mm=metrics(f"results/latest/{prefix}_to_jita.csv")
                  cm=metrics(f"results/latest/{prefix}_contracts.csv")
                  w.writerow({
                      "ts_utc":now,"station":station,"structure_id":sid,
                      "source_sell_types":mf.get("source_sell_types",0),
                      "market_prefilter":mf.get("prefilter_candidates",0),
                      "market_rows":mm["rows"],"market_mail":mm["mail"],
                      "market_max_profit":round(mm["max_profit"],2),
                      "market_median_profit":round(mm["median_profit"],2),
                      "active_contracts":cf.get("active_contracts",0),
                      "plain_contracts":cf.get("plain_item_contracts",0),
                      "contract_rows":cm["rows"],"contract_mail":cm["mail"],
                      "contract_max_profit":round(cm["max_profit"],2),
                      "contract_median_profit":round(cm["median_profit"],2),
                  })
          PY

      - name: Build shadow summary
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "## DC shadow scan"
            echo ""
            echo "- TCAG-3: structure ${{ steps.resolve.outputs.tcag_id }}, market pages ${{ steps.resolve.outputs.tcag_pages }}"
            echo "- O4T-Z5: structure ${{ steps.resolve.outputs.o4t_id }}, market pages ${{ steps.resolve.outputs.o4t_pages }}"
            echo "- Mode: shadow only; no EVE mail, no auto-buy, no production channel."
            echo "- Assumed freight reserve: 5M + 1,250 ISK/m³."
            echo ""
            for f in results/latest/shadow_dc_*_to_jita.md results/latest/shadow_dc_*_contracts.md; do
              [ -f "$f" ] || continue
              echo "---"
              head -n 35 "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist shadow observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"

          SNAPSHOT="$(mktemp -d)"
          mkdir -p "$SNAPSHOT/latest" "$SNAPSHOT/state"
          find results/latest -maxdepth 1 -type f -name 'shadow_dc_*' -exec cp {} "$SNAPSHOT/latest/" \; 2>/dev/null || true
          [ -f results/state/dc_shadow_history.csv ] && cp results/state/dc_shadow_history.csv "$SNAPSHOT/state/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/latest results/state
            cp -a "$SNAPSHOT/latest/." results/latest/ 2>/dev/null || true
            cp -a "$SNAPSHOT/state/." results/state/ 2>/dev/null || true
            git add results/latest/shadow_dc_* results/state/dc_shadow_history.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No shadow changes."
              exit 0
            fi
            git commit -m "data: refresh DC shadow observations $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
