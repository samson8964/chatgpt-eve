name: Deploy Cloudflare EVE Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/worker_mail_sender.js'
      - 'cloudflare/wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
      EVE_DISPATCH_TOKEN: ${{ secrets.EVE_DISPATCH_TOKEN }}
      WORKER_URL: https://eve-contract-opener.99617224.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 2; }
          test -n "${EVE_MAIL_API_KEY:-}" || { echo 'Missing GitHub secret: EVE_MAIL_API_KEY'; exit 2; }

      - name: Validate Worker bundle
        shell: bash
        run: |
          npx --yes wrangler@latest deploy \
            --config cloudflare/wrangler.jsonc \
            --strict \
            --dry-run

      - name: Deploy Worker safely
        shell: bash
        run: |
          npx --yes wrangler@latest deploy \
            --config cloudflare/wrangler.jsonc \
            --strict

      - name: Sync GitHub dispatch token to Worker
        if: env.EVE_DISPATCH_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EVE_DISPATCH_TOKEN" | npx --yes wrangler@latest secret put EVE_DISPATCH_TOKEN \
            --config cloudflare/wrangler.jsonc

      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          health_status=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "$WORKER_URL/health")
          mail_status=$(curl -sS -o /tmp/mail-health.txt -w '%{http_code}' \
            -H "Authorization: Bearer $EVE_MAIL_API_KEY" \
            "$WORKER_URL/api/mail-health")
          scheduler_status=$(curl -sS -o /tmp/scheduler-health.txt -w '%{http_code}' \
            -H "Authorization: Bearer $EVE_MAIL_API_KEY" \
            "$WORKER_URL/api/scheduler-health")
          echo "health_status=$health_status"
          echo "mail_health_status=$mail_status"
          echo "scheduler_health_status=$scheduler_status"
          cat /tmp/mail-health.txt
          cat /tmp/scheduler-health.txt
          test "$health_status" = "200"
          test "$mail_status" = "200"
          test "$scheduler_status" = "200"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/mail-health.txt', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('sender_name') == 'LadyGuaGua', data
          print('mail sender verified:', data.get('sender_name'), data.get('sender_id'), data.get('token_source'))
          scheduler = json.load(open('/tmp/scheduler-health.txt', encoding='utf-8'))
          assert scheduler.get('ok') is True, scheduler
          print('scheduler configured:', scheduler.get('configured'), scheduler.get('fast_scan'), scheduler.get('bpc_deep'))
          PY

      - name: Verify C-J6MT live ESI market permission (non-blocking)
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          status=$(curl -sS -o "$output" -w '%{http_code}' --max-time 50 \
            -H "Authorization: Bearer $EVE_MAIL_API_KEY" \
            "$WORKER_URL/api/structure-market?structure_id=1049588174021&page=1&auth_profile=cj")
          echo "cj_market_http_status=$status"
          if [ "$status" != "200" ]; then
            echo "::warning::C-J6MT still lacks ESI market access (HTTP $status). Check in-game structure ACL and /auth-cj."
          else
            python - "$output" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("ok"):
              print("cj_live_market_access=verified")
              print("cj_market_page1_orders=", len(payload.get("orders") or []))
          else:
              print("::warning::C-J market returned HTTP 200 but ok=false; access not verified")
          PY
          fi

      - name: Warn if Cloudflare scheduler token is not configured
        if: env.EVE_DISPATCH_TOKEN == ''
        run: |
          echo "::warning::EVE_DISPATCH_TOKEN is missing. Cron triggers are deployed but cannot dispatch GitHub workflows until this secret is added and this deploy workflow is re-run."
