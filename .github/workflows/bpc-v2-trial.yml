name: BPC V2 end-to-end trial

on:
  workflow_dispatch:
  push:
    branches:
      - opportunity-engine-v2
    paths:
      - '.github/workflows/bpc-v2-trial.yml'

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: opportunity-engine-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BPC baseline manufacturing scan
        env:
          MARKET_BROKER_FEE_RATE: '0'
          EXPECTED_RELISTS: '0'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          PREFILTER_TOP: '250'
          HIGHSEC_FACTORY_CANDIDATES: '2'
          ACCOUNTING_LEVEL: '5'
        run: python runner_buy_only.py

      - name: Run BPC intrinsic-value benchmark
        env:
          BPC_VALUE_MIN_SAMPLES: '3'
          BPC_VALUE_MIN_EXACT_SAMPLES: '3'
          BPC_VALUE_MIN_DISCOUNT: '0.25'
          BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.10'
          BPC_VALUE_MIN_SURPLUS: '10000000'
          BPC_VALUE_MIN_HOURS_TO_EXPIRE: '2'
          BPC_VALUE_TOP: '200'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
        run: python bpc_contract_benchmark_buy_only.py

      - name: Apply BPC buy-only policy
        env:
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
        run: python apply_buy_only_bpc_policy.py

      - name: Run BPC Opportunity Engine V2 trial runner
        env:
          BPC_V2_LIVE_POOL: '30'
          BPC_V2_LIVE_WORKERS: '10'
          BPC_V2_MIN_NET_PROFIT: '20000000'
          BPC_V2_MIN_NET_ROI: '0.10'
          BPC_V2_MAX_SLIPPAGE: '0.05'
          BPC_V2_MAX_CHANGE: '0.15'
          BPC_V2_LIQUIDITY_PARTICIPATION: '0.35'
        run: python runner_bpc_v2.py

      - name: Validate V2 outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          m = Path('results/latest/ranked_opportunities_v2.csv')
          s = Path('results/latest/bpc_v2_safe_candidates.csv')
          p = Path('results/latest/bpc_v2_safe_mail_preview.html')
          assert m.exists(), 'missing manufacturing V2 output'
          assert s.exists(), 'missing SAFE export'
          assert p.exists(), 'missing SAFE mail preview'
          mdf = pd.read_csv(m)
          sdf = pd.read_csv(s)
          if not sdf.empty:
              assert sdf['v2_status'].eq('SAFE').all()
              assert (pd.to_numeric(sdf['v2_live_net_profit'], errors='coerce') >= 20_000_000).all()
              assert (pd.to_numeric(sdf['v2_live_net_roi'], errors='coerce') >= 0.10).all()
              assert (pd.to_numeric(sdf['v2_stress_net_profit'], errors='coerce') > 0).all()
          print('SAFE rows:', len(sdf))
          print('BPC V2 trial validation passed')
          PY

      - name: Upload end-to-end trial outputs
        uses: actions/upload-artifact@v4
        with:
          name: bpc-v2-end-to-end-trial
          path: |
            results/latest/ranked_opportunities.csv
            results/latest/ranked_opportunities_v2.csv
            results/latest/bpc_v2_safe_candidates.csv
            results/latest/bpc_v2_safe_mail_preview.html
            results/latest/bpc_value_opportunities.csv
            results/latest/bpc_value_opportunities_v2.csv
            results/latest/meta.json
          if-no-files-found: error
