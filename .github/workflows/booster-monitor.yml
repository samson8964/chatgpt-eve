name: 药品制造蓝图监控
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 连续核验轮数（每轮最多 800 个新合同）
        type: choice
        options: ['1', '10']
        default: '1'
      dry_run:
        description: 只扫描，不发邮件
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['booster-monitor/**', '.github/workflows/booster-monitor.yml']
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
concurrency:
  group: eve-booster-manufacturing-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装独立药品监控依赖
        run: python -m pip install -r booster-monitor/requirements.txt
      - name: 检查估值与投递保护
        run: python booster-monitor/test_monitor.py
      - name: 扫描与游戏邮件提醒
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SCAN_ROUNDS: ${{ inputs.rounds || '1' }}
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = "1" ]; then args+=(--dry-run); fi
          python booster-monitor/cloud_run.py --limit 800 --rounds "$SCAN_ROUNDS" "${args[@]}"
