name: V4 durable ledger isolated canary
on:
  push:
    branches: ['rebuild/v4-isolated-20261013']
    paths:
      - 'cloudflare/v4_store.js'
      - 'cloudflare/v4_smoke_worker.js'
      - 'cloudflare/wrangler.v4-canary.jsonc'
      - '.github/workflows/v4-ledger-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify code and Cloudflare Worker bindings before deployment
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.v4-canary.jsonc --dry-run
      - name: Deploy independent state-only canary (does not touch live V3)
        run: npx --yes wrangler@latest deploy --config cloudflare/wrangler.v4-canary.jsonc
      - name: Verify SQLite-backed durable actor
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 --max-time 20 \
            https://eve-v4-ledger-canary.99617224.workers.dev/health \
            | tee /tmp/health-v4.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health-v4.json'))
          assert d.get('ok') is True, d
          assert d.get('backend') == 'v4-durable-sqlite', d
          assert not d.get('dispatch_enabled'), d
          print('V4 durable ledger canary verified; real notifications disabled')
          PY
