name: EVE BPC arbitrage scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner.py'
      - 'requirements.txt'
      - '.github/workflows/scan.yml'
  schedule:
    # Beijing time 08:30 and 20:30 (UTC+8)
    - cron: '30 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: eve-bpc-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit refreshed results
        shell: bash
        run: |
          git config user.name "eve-bpc-bot"
          git config user.email "eve-bpc-bot@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "data: refresh EVE BPC opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
