name: EVE dual arbitrage scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'runner.py'
      - 'scanner_source.py'
      - 'bpc_contract_benchmark.py'
      - 'contract_deal_scanner.py'
      - 'filter_reachable_contract_deals.py'
      - 'prepare_mail_candidates.py'
      - 'payload/**'
      - 'requirements.txt'
      - 'add_action_links.py'
      - 'send_eve_mail_fast.py'
      - 'send_eve_mail_dual.py'
      - 'send_eve_mail_quality.py'
      - '.github/workflows/scan.yml'
  schedule:
    # Run every 30 minutes. GitHub Actions cron uses UTC.
    - cron: '5,35 * * * *'

permissions:
  contents: write

concurrency:
  group: eve-dual-scan-v1
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast BPC manufacturing scanner
        run: python runner.py

      - name: Scan all-space BPC intrinsic value per run
        env:
          # Keep the scanner fairly broad; the mail gate below is deliberately stricter.
          BPC_VALUE_MIN_SAMPLES: '3'
          BPC_VALUE_MIN_EXACT_SAMPLES: '3'
          BPC_VALUE_MIN_DISCOUNT: '0.25'
          BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.10'
          BPC_VALUE_MIN_SURPLUS: '10000000'
          BPC_VALUE_MIN_HOURS_TO_EXPIRE: '2'
          BPC_VALUE_TOP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python bpc_contract_benchmark.py

      - name: Run all-space spot contract deal scanner
        env:
          DEAL_MIN_CONTRACT_PRICE: '1000000'
          DEAL_MIN_PRELIM_EDGE: '8000000'
          DEAL_MIN_NET_PROFIT: '15000000'
          DEAL_MIN_NET_ROI: '0.10'
          DEAL_MIN_LIST_NET_PROFIT: '25000000'
          DEAL_MIN_LIST_NET_ROI: '0.15'
          DEAL_JITA_NEAR_SECURE_JUMPS: '25'
          DEAL_LOCATION_PREFILTER_TOP: '500'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python contract_deal_scanner.py

      - name: Exclude unreachable contract systems
        run: python filter_reachable_contract_deals.py

      - name: Prepare strict fresh mail candidates
        env:
          # Spot mail: only immediately liquidatable A deals; survive a 5% adverse Jita price move.
          MAIL_SPOT_STRESS_PRICE_DROP: '0.05'
          MAIL_SPOT_MIN_STRESS_PROFIT: '15000000'
          MAIL_SPOT_MIN_STRESS_ROI: '0.10'
          MAIL_SPOT_MIN_BUY_COVERAGE: '0.95'
          # BPC mail: stronger evidence than the broad scanner itself.
          MAIL_BPC_VALUE_MIN_SAMPLES: '5'
          MAIL_BPC_VALUE_MIN_AVG_DISCOUNT: '0.30'
          MAIL_BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.20'
          MAIL_BPC_VALUE_MIN_SURPLUS: '20000000'
          MAIL_BPC_MFG_MIN_PROFIT: '20000000'
          MAIL_BPC_MFG_MIN_ROI: '0.10'
        run: python prepare_mail_candidates.py

      - name: Add one-click EVE links
        run: python add_action_links.py

      - name: Send fresh top-10 EVE mail digests
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '80'
          # New contracts receive a large ranking bonus; repeats cool down for 24h.
          MAIL_FRESHNESS_WEIGHT: '2.0'
          MAIL_REPEAT_COOLDOWN_HOURS: '24'
          MAIL_REPEAT_IMPROVEMENT: '0.25'
        run: python send_eve_mail_quality.py

      - name: Commit refreshed results
        shell: bash
        run: |
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "data: refresh EVE dual opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Code/doc commits can land while a long scan is running. Rebase the result commit
          # before pushing so mail history and refreshed CSV state are not lost to non-fast-forward errors.
          git pull --rebase origin main
          git push
