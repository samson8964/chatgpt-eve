name: EVE arbitrage scans

on:
  workflow_dispatch:
  push:
    paths:
      - 'runner.py'
      - 'scanner_source.py'
      - 'bpc_contract_benchmark.py'
      - 'contract_deal_scanner.py'
      - 'filter_reachable_contract_deals.py'
      - 'multi_item_contract_scanner.py'
      - 'prepare_mail_candidates.py'
      - 'payload/**'
      - 'requirements.txt'
      - 'add_action_links.py'
      - 'send_eve_mail_fast.py'
      - 'send_eve_mail_dual.py'
      - 'send_eve_mail_quality.py'
      - 'send_multi_item_mail.py'
      - '.github/workflows/scan.yml'
  schedule:
    # Run every 30 minutes. GitHub Actions cron uses UTC.
    - cron: '5,35 * * * *'

permissions:
  contents: write

concurrency:
  group: eve-arbitrage-scan-v2
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast BPC manufacturing scanner
        run: python runner.py

      - name: Scan all-space BPC intrinsic value per run
        env:
          # Broad discovery gate. Mail filtering below uses stricter evidence thresholds.
          BPC_VALUE_MIN_SAMPLES: '3'
          BPC_VALUE_MIN_EXACT_SAMPLES: '3'
          BPC_VALUE_MIN_DISCOUNT: '0.25'
          BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.10'
          BPC_VALUE_MIN_SURPLUS: '10000000'
          BPC_VALUE_MIN_HOURS_TO_EXPIRE: '2'
          BPC_VALUE_TOP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python bpc_contract_benchmark.py

      - name: Run all-space spot contract deal scanner
        env:
          DEAL_MIN_CONTRACT_PRICE: '1000000'
          DEAL_MIN_PRELIM_EDGE: '8000000'
          DEAL_MIN_NET_PROFIT: '15000000'
          DEAL_MIN_NET_ROI: '0.10'
          DEAL_MIN_LIST_NET_PROFIT: '25000000'
          DEAL_MIN_LIST_NET_ROI: '0.15'
          DEAL_JITA_NEAR_SECURE_JUMPS: '25'
          DEAL_LOCATION_PREFILTER_TOP: '500'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python contract_deal_scanner.py

      - name: Exclude unreachable contract systems
        run: python filter_reachable_contract_deals.py

      - name: Scan reachable multi-item bundle contracts
        env:
          # Independent bundle-deal track: at least two item types, reliable valuation,
          # >=30% discount to conservative net value and >=30M absolute value gap.
          MULTI_MIN_TYPES: '2'
          MULTI_MIN_CONTRACT_PRICE: '1000000'
          MULTI_MIN_DISCOUNT: '0.30'
          MULTI_MIN_VALUE_GAP: '30000000'
          MULTI_MIN_VALUE_COVERAGE: '0.90'
          MULTI_MIN_A_BUY_COVERAGE: '0.90'
          MULTI_MIN_HOURS_TO_EXPIRE: '1'
          MULTI_HISTORY_WORKERS: '16'
          MULTI_TOP: '250'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python multi_item_contract_scanner.py

      - name: Prepare mail candidates
        env:
          # Spot: A immediate-buy and B listing opportunities share the final mail gate.
          MAIL_SPOT_MIN_PROFIT: '30000000'
          MAIL_SPOT_MIN_ROI: '0.10'
          # BPC intrinsic-value and manufacturing are independent qualification routes.
          MAIL_BPC_VALUE_MIN_SAMPLES: '5'
          MAIL_BPC_VALUE_MIN_AVG_DISCOUNT: '0.30'
          MAIL_BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.20'
          MAIL_BPC_VALUE_MIN_SURPLUS: '20000000'
          MAIL_BPC_MFG_MIN_PROFIT: '20000000'
          MAIL_BPC_MFG_MIN_ROI: '0.10'
        run: python prepare_mail_candidates.py

      - name: Add one-click EVE links
        run: python add_action_links.py

      - name: Send changed spot and BPC top-10 digests
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '80'
        run: python send_eve_mail_quality.py

      - name: Send changed multi-item top-10 digest
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '80'
        run: python send_multi_item_mail.py

      - name: Commit refreshed results safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"

          # Preserve exactly the results produced by this scan. The workflow may have started
          # from an older event SHA, especially when a previous Actions run is re-run manually.
          RESULTS_SNAPSHOT="$(mktemp -d)"
          cp -a results/. "$RESULTS_SNAPSHOT/"

          for attempt in 1 2 3; do
            echo "Result push attempt $attempt/3"

            # Always rebuild the result commit on top of the newest main instead of rebasing
            # an old event commit. This prevents non-fast-forward errors and most result conflicts.
            git fetch origin main
            git reset --hard origin/main
            rm -rf results
            mkdir -p results
            cp -a "$RESULTS_SNAPSHOT/." results/
            git add results

            if git diff --cached --quiet; then
              echo "No result changes relative to latest main."
              exit 0
            fi

            git commit -m "data: refresh EVE arbitrage opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Results pushed successfully."
              exit 0
            fi

            echo "Remote main advanced during push; retrying on newest main..."
            sleep $((attempt * 2))
          done

          echo "Failed to push refreshed results after 3 attempts."
          exit 1
