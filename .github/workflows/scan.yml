name: EVE V3 production scans

on:
  workflow_dispatch:

permissions:
  contents: write

# V3 is the sole production opportunity engine.
# Cloudflare/manual workflow_dispatch owns scheduling.
# Legacy V2 public/multi/4-H/C-J production scanners remain disabled.
# The mature BPC specialist evaluator is retained as a V3 sub-engine and normalized
# through v3_bpc_adapter.py before the unified V3 mail policy is applied.
concurrency:
  group: eve-v3-production
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAIL_MIN_VERIFIED_NET_PROFIT: '50000000'
      MIN_PROFIT_PER_M3: '2000'
      V3_FULL_CASH_MAIL_ENABLED: '1'

      # BPC formal mail gate: Jita manufacturing profit >=50M, ROI >=10%,
      # positive Jita stress profit, and complete material/product order-book depth.
      MAIL_BPC_MFG_MIN_JITA_PROFIT: '50000000'
      MAIL_BPC_MFG_MIN_JITA_ROI: '0.10'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Record production scan start and clear generated outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/latest results/state
          date -u +%s > results/state/last_scan_started_epoch.txt

          # Fail closed on partial channel outages: never let a previous run's V3
          # result masquerade as a fresh opportunity.
          rm -f results/latest/v3_*.csv results/latest/v3_*.md results/latest/v3_*funnel.json
          rm -f results/latest/ranked_opportunities.csv
          rm -f results/latest/ranked_opportunities_v2.csv
          rm -f results/latest/bpc_value_opportunities.csv
          rm -f results/latest/bpc_value_opportunities_v2.csv
          rm -f results/latest/bpc_v2_safe_candidates.csv
          rm -f results/latest/bpc_v2_safe_mail_preview.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BPC buy-only discovery
        id: bpc_base
        continue-on-error: true
        env:
          MARKET_BROKER_FEE_RATE: '0'
          EXPECTED_RELISTS: '0'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          PREFILTER_TOP: '500'
          BPC_POOL_RESERVE_MULTIPLIER: '1.25'
          BPC_POOL_PROFIT_SHARE: '0.40'
          BPC_POOL_ROI_SHARE: '0.20'
          BPC_POOL_NEWEST_SHARE: '0.15'
          BPC_POOL_EXPLORATION_SHARE: '0.15'
          BPC_POOL_DIVERSITY_SHARE: '0.10'
        run: python runner_buy_only.py

      - name: Refresh BPC comparable-value research
        id: bpc_value
        continue-on-error: true
        if: steps.bpc_base.outcome == 'success'
        env:
          BPC_VALUE_MIN_SAMPLES: '3'
          BPC_VALUE_MIN_EXACT_SAMPLES: '3'
          BPC_VALUE_MIN_DISCOUNT: '0.25'
          BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.10'
          BPC_VALUE_MIN_SURPLUS: '10000000'
          BPC_VALUE_MIN_HOURS_TO_EXPIRE: '2'
          BPC_VALUE_TOP: '200'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: |
          python bpc_contract_benchmark_buy_only.py
          python apply_buy_only_bpc_policy.py

      - name: Run BPC specialist live revalidation
        id: bpc_live
        continue-on-error: true
        if: steps.bpc_base.outcome == 'success'
        env:
          BPC_V2_LIVE_POOL: '50'
          BPC_V2_LIVE_WORKERS: '16'
          BPC_V2_MIN_NET_PROFIT: '20000000'
          BPC_V2_MIN_NET_ROI: '0.10'
          BPC_V2_MAX_SLIPPAGE: '0.05'
          BPC_V2_MAX_CHANGE: '0.15'
          BPC_V2_LIQUIDITY_PARTICIPATION: '0.35'
        run: python runner_bpc_v2.py

      - name: Normalize BPC into V3 policy output
        id: bpc_v3
        continue-on-error: true
        if: steps.bpc_live.outcome == 'success'
        run: python v3_bpc_adapter.py

      - name: Run V3 public-contract engine
        id: v3_public
        continue-on-error: true
        env:
          DEAL_MIN_CONTRACT_PRICE: '1000000'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          DEAL_MIN_HOURS_TO_EXPIRE: '0.5'
          DEAL_SKIN_MAJOR_SHARE: '0.50'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
          V3_PUBLIC_LIVE_LIMIT: '600'
          V3_PUBLIC_PROFIT_SHARE: '0.25'
          V3_PUBLIC_ROI_SHARE: '0.15'
          V3_PUBLIC_LIST_PROFIT_SHARE: '0.10'
          V3_PUBLIC_LIST_ROI_SHARE: '0.05'
          V3_PUBLIC_CHANGE_SHARE: '0.15'
          V3_PUBLIC_NEWEST_SHARE: '0.13'
          V3_PUBLIC_EXPLORATION_SHARE: '0.12'
          V3_PUBLIC_DIVERSITY_SHARE: '0.05'
          V3_LIST_HISTORY_LIMIT: '160'
        run: python opportunity_engine_v3_scanner.py

      - name: Scan Amarr procurement to Jita
        id: amarr
        continue-on-error: true
        env:
          V3_SOURCE_KIND: npc
          V3_SOURCE_KEY: amarr
          V3_SOURCE_LABEL: 'Amarr VIII (Oris) - Emperor Family Academy'
          V3_SOURCE_REGION_ID: '10000043'
          V3_SOURCE_STATION_ID: '60008494'
          V3_SOURCE_LIVE_LIMIT: '180'
          V3_SOURCE_TOP: '120'
          V3_SOURCE_RESULT_CSV: 'v3_amarr_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'v3_amarr_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'v3_amarr_to_jita_funnel.json'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
        run: python v3_source_market_scanner.py

      - name: Scan Dodixie procurement to Jita
        id: dodixie
        continue-on-error: true
        env:
          V3_SOURCE_KIND: npc
          V3_SOURCE_KEY: dodixie
          V3_SOURCE_LABEL: 'Dodixie IX - Moon 20 - Federation Navy Assembly Plant'
          V3_SOURCE_REGION_ID: '10000032'
          V3_SOURCE_STATION_ID: '60011866'
          V3_SOURCE_LIVE_LIMIT: '180'
          V3_SOURCE_TOP: '120'
          V3_SOURCE_RESULT_CSV: 'v3_dodixie_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'v3_dodixie_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'v3_dodixie_to_jita_funnel.json'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
        run: python v3_source_market_scanner.py

      - name: Scan 4-H market procurement with V3
        id: four_h_market
        continue-on-error: true
        env:
          V3_SOURCE_KIND: structure
          V3_SOURCE_KEY: four_h
          V3_SOURCE_LABEL: '4-HWWF'
          SOURCE_STRUCTURE_ID: '1053970513596'
          SOURCE_MARKET_KEY: four_h
          SOURCE_MARKET_LABEL: '4-HWWF'
          SOURCE_AUTH_PROFILE: main
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          V3_SOURCE_HAUL_BASE: '10000000'
          V3_SOURCE_HAUL_ISK_PER_M3: '500'
          V3_SOURCE_HAUL_ISK_PER_M3_JUMP: '0'
          V3_SOURCE_RESULT_CSV: 'v3_four_h_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'v3_four_h_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'v3_four_h_to_jita_funnel.json'
        run: python v3_source_market_scanner.py

      - name: Scan C-J6MT market procurement with V3
        id: cj_market
        continue-on-error: true
        env:
          V3_SOURCE_KIND: structure
          V3_SOURCE_KEY: cj
          V3_SOURCE_LABEL: "C-J6MT - 1st Taj Mahgoon (DJ's Retirement Fund)"
          SOURCE_STRUCTURE_ID: '1049588174021'
          SOURCE_MARKET_KEY: cj
          SOURCE_MARKET_LABEL: "C-J6MT - 1st Taj Mahgoon (DJ's Retirement Fund)"
          SOURCE_AUTH_PROFILE: cj
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          V3_SOURCE_HAUL_BASE: '10000000'
          V3_SOURCE_HAUL_ISK_PER_M3: '500'
          V3_SOURCE_HAUL_ISK_PER_M3_JUMP: '0'
          V3_SOURCE_RESULT_CSV: 'v3_cj_to_jita.csv'
          V3_SOURCE_REPORT_MD: 'v3_cj_to_jita.md'
          V3_SOURCE_FUNNEL_JSON: 'v3_cj_to_jita_funnel.json'
        run: python v3_source_market_scanner.py

      - name: Scan 4-H contracts with V3 ExecutionProof
        id: four_h_contract
        continue-on-error: true
        env:
          SOURCE_STRUCTURE_ID: '1053970513596'
          SOURCE_LABEL: '4-HWWF'
          SOURCE_AUTH_PROFILE: main
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          V3_STRUCTURE_KEY: four_h
          V3_STRUCTURE_HAUL_BASE: '10000000'
          V3_STRUCTURE_HAUL_ISK_PER_M3: '500'
          V3_STRUCTURE_CONTRACT_RESULT_CSV: 'v3_four_h_contracts.csv'
          V3_STRUCTURE_CONTRACT_REPORT_MD: 'v3_four_h_contracts.md'
          V3_STRUCTURE_CONTRACT_FUNNEL_JSON: 'v3_four_h_contracts_funnel.json'
        run: python v3_structure_contract_scanner.py

      - name: Scan C-J6MT contracts with V3 ExecutionProof
        id: cj_contract
        continue-on-error: true
        env:
          SOURCE_STRUCTURE_ID: '1049588174021'
          SOURCE_LABEL: 'C-J6MT'
          SOURCE_AUTH_PROFILE: cj
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          V3_STRUCTURE_KEY: cj
          V3_STRUCTURE_HAUL_BASE: '10000000'
          V3_STRUCTURE_HAUL_ISK_PER_M3: '500'
          V3_STRUCTURE_CONTRACT_RESULT_CSV: 'v3_cj_contracts.csv'
          V3_STRUCTURE_CONTRACT_REPORT_MD: 'v3_cj_contracts.md'
          V3_STRUCTURE_CONTRACT_FUNNEL_JSON: 'v3_cj_contracts_funnel.json'
        run: python v3_structure_contract_scanner.py

      - name: Scan Jita to 4-H reverse market with V3
        id: v3_reverse
        continue-on-error: true
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MARKET_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          FOUR_H_STRUCTURE_ID: '1053970513596'
          V3_4H_REVERSE_MIN_PROFIT: '20000000'
          V3_4H_REVERSE_MIN_ROI: '0.10'
          V3_4H_REVERSE_HAUL_BASE: '10000000'
          V3_4H_REVERSE_HAUL_ISK_PER_M3: '500'
        run: python four_h_reverse_scanner_v3.py

      - name: Build V3 production summary
        if: always()
        run: python v3_cutover_summary.py

      - name: Send unified V3 formal opportunity mail
        id: mail_v3
        continue-on-error: true
        if: always()
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_RECIPIENT_NAMES: 'MikeChong,LadyBaBa'
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
        run: python send_v3_opportunity_mail.py

      - name: Persist V3 production results
        id: persist_results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"

          RESULTS_SNAPSHOT="$(mktemp -d)"
          cp -a results/. "$RESULTS_SNAPSHOT/"

          for attempt in 1 2 3; do
            echo "Result push attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            rm -rf results
            mkdir -p results
            cp -a "$RESULTS_SNAPSHOT/." results/
            git add results

            if git diff --cached --quiet; then
              echo "No result changes relative to latest main."
              exit 0
            fi

            git commit -m "data: refresh V3 production opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "V3 production results pushed."
              exit 0
            fi

            echo "Remote main advanced during push; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to persist V3 production results."
          exit 1

      - name: Final V3 production health gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "bpc_base:${{ steps.bpc_base.outcome }}" \
            "bpc_live:${{ steps.bpc_live.outcome }}" \
            "bpc_v3:${{ steps.bpc_v3.outcome }}" \
            "v3_public:${{ steps.v3_public.outcome }}" \
            "amarr:${{ steps.amarr.outcome }}" \
            "dodixie:${{ steps.dodixie.outcome }}" \
            "four_h_market:${{ steps.four_h_market.outcome }}" \
            "cj_market:${{ steps.cj_market.outcome }}" \
            "four_h_contract:${{ steps.four_h_contract.outcome }}" \
            "cj_contract:${{ steps.cj_contract.outcome }}" \
            "v3_reverse:${{ steps.v3_reverse.outcome }}" \
            "mail_v3:${{ steps.mail_v3.outcome }}" \
            "persist_results:${{ steps.persist_results.outcome }}"
          do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            echo "$name=$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done

          echo "bpc_value=${{ steps.bpc_value.outcome }}"
          if [ "${{ steps.bpc_value.outcome }}" = "failure" ]; then
            echo "::warning::BPC comparable-value research failed; strict manufacturing mail remains independent."
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::V3 production completed with one or more degraded critical channels."
            exit 1
          fi
          echo "V3 production health OK."
