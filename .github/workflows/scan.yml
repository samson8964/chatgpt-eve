name: EVE BPC arbitrage scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'runner.py'
      - 'scanner_source.py'
      - 'payload/**'
      - 'requirements.txt'
      - 'add_action_links.py'
      - 'send_eve_mail_fast.py'
      - '.github/workflows/scan.yml'
  schedule:
    # Beijing time 08:35 and 20:35 (UTC+8), after the half-hour EVE Ref snapshot is normally published.
    - cron: '35 0,12 * * *'

permissions:
  contents: write

concurrency:
  group: eve-bpc-scan-v3
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast scanner
        run: python runner.py

      - name: Add one-click EVE links
        run: python add_action_links.py

      - name: Send filtered EVE mail digest
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_MIN_NET_PROFIT: '10000000'
          MAIL_MIN_NET_ROI: '0.08'
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '50'
        run: python send_eve_mail_fast.py

      - name: Commit refreshed results
        shell: bash
        run: |
          git config user.name "eve-bpc-bot"
          git config user.email "eve-bpc-bot@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "data: refresh EVE BPC opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
