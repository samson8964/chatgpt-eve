name: EVE arbitrage scans

on:
  workflow_dispatch:
  push:
    paths:
      - 'runner.py'
      - 'scanner_source.py'
      - 'bpc_contract_benchmark.py'
      - 'apply_buy_only_bpc_policy.py'
      - 'buy_only_contract_scanner.py'
      - 'prepare_mail_candidates.py'
      - 'payload/**'
      - 'requirements.txt'
      - 'add_action_links.py'
      - 'send_eve_mail_fast.py'
      - 'send_eve_mail_dual.py'
      - 'send_eve_mail_quality.py'
      - 'send_eve_mail_quality_multi.py'
      - 'send_multi_item_mail.py'
      - 'send_multi_item_mail_multi.py'
      - '.github/workflows/scan.yml'
  schedule:
    # GitHub schedule events may be delayed or dropped. Give the scheduler a chance every 10 minutes,
    # then use the cadence gate below so a full scan normally starts only about every 30 minutes.
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: eve-arbitrage-scan-v4-buy-only
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Cadence gate
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            echo "Manual/push event: run immediately."
            exit 0
          fi

          stamp="results/state/last_scan_started_epoch.txt"
          now="$(date -u +%s)"
          if [ -f "$stamp" ]; then
            last="$(tr -dc '0-9' < "$stamp")"
          else
            last=""
          fi

          if [ -n "$last" ]; then
            age=$((now - last))
          else
            age=999999
          fi

          if [ "$age" -lt 1500 ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "Skip full scan: previous scan started ${age}s ago (<25m)."
          else
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            echo "Run full scan: previous scan started ${age}s ago."
          fi

      - name: Record scan start
        if: steps.cadence.outputs.run_scan == 'true'
        shell: bash
        run: |
          mkdir -p results/state
          date -u +%s > results/state/last_scan_started_epoch.txt

      - name: Set up Python
        if: steps.cadence.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.cadence.outputs.run_scan == 'true'
        run: pip install -r requirements.txt

      - name: Run BPC manufacturing scanner with Jita buy-only revenue
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          # Products are liquidated into existing Jita buy orders. No broker/relist fee is charged
          # for placing a sell order because no sell order is placed.
          MARKET_BROKER_FEE_RATE: '0'
          EXPECTED_RELISTS: '0'
        run: python runner.py

      - name: Scan all-space BPC intrinsic value per run
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          BPC_VALUE_MIN_SAMPLES: '3'
          BPC_VALUE_MIN_EXACT_SAMPLES: '3'
          BPC_VALUE_MIN_DISCOUNT: '0.25'
          BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.10'
          BPC_VALUE_MIN_SURPLUS: '10000000'
          BPC_VALUE_MIN_HOURS_TO_EXPIRE: '2'
          BPC_VALUE_TOP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python bpc_contract_benchmark.py

      - name: Enforce BPC price cap, SKIN exclusions and buy-only economics
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
        run: python apply_buy_only_bpc_policy.py

      - name: Scan spot and multi-item contracts using Jita buy depth only
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          DEAL_MIN_CONTRACT_PRICE: '1000000'
          DEAL_MAX_CONTRACT_PRICE: '5000000000'
          DEAL_MIN_NET_PROFIT: '30000000'
          DEAL_MIN_NET_ROI: '0.10'
          DEAL_MIN_HOURS_TO_EXPIRE: '0.5'
          DEAL_TOP: '250'
          MULTI_TOP: '250'
          DEAL_SKIN_MAJOR_SHARE: '0.50'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python buy_only_contract_scanner.py

      - name: Prepare mail candidates
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          MAIL_SPOT_MIN_PROFIT: '30000000'
          MAIL_SPOT_MIN_ROI: '0.10'
          MAIL_BPC_VALUE_MIN_SAMPLES: '5'
          MAIL_BPC_VALUE_MIN_AVG_DISCOUNT: '0.30'
          MAIL_BPC_VALUE_MIN_MEDIAN_DISCOUNT: '0.20'
          MAIL_BPC_VALUE_MIN_SURPLUS: '20000000'
          MAIL_BPC_MFG_MIN_PROFIT: '20000000'
          MAIL_BPC_MFG_MIN_ROI: '0.10'
        run: python prepare_mail_candidates.py

      - name: Add one-click EVE links
        if: steps.cadence.outputs.run_scan == 'true'
        run: python add_action_links.py

      - name: Send changed spot and BPC top-10 digests
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_RECIPIENT_NAMES: 'MikeChong,Vektor Yang'
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '80'
        run: python send_eve_mail_quality_multi.py

      - name: Send changed multi-item top-10 digest
        if: steps.cadence.outputs.run_scan == 'true'
        env:
          EVE_MAIL_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
          EVE_MAIL_RECIPIENT_NAME: MikeChong
          EVE_MAIL_RECIPIENT_NAMES: 'MikeChong,Vektor Yang'
          EVE_MAIL_WORKER_URL: https://eve-contract-opener.99617224.workers.dev
          MAIL_TOP: '10'
          MAIL_LIVE_POOL: '80'
        run: python send_multi_item_mail_multi.py

      - name: Commit refreshed results safely
        if: steps.cadence.outputs.run_scan == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eve-arbitrage-bot"
          git config user.email "eve-arbitrage-bot@users.noreply.github.com"

          RESULTS_SNAPSHOT="$(mktemp -d)"
          cp -a results/. "$RESULTS_SNAPSHOT/"

          for attempt in 1 2 3; do
            echo "Result push attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            rm -rf results
            mkdir -p results
            cp -a "$RESULTS_SNAPSHOT/." results/
            git add results

            if git diff --cached --quiet; then
              echo "No result changes relative to latest main."
              exit 0
            fi

            git commit -m "data: refresh EVE arbitrage opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Results pushed successfully."
              exit 0
            fi

            echo "Remote main advanced during push; retrying on newest main..."
            sleep $((attempt * 2))
          done

          echo "Failed to push refreshed results after 3 attempts."
          exit 1
