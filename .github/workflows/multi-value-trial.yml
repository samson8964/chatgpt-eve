name: Multi-item value trial

on:
  push:
    branches:
      - restore-independent-multi-value
    paths:
      - 'multi_item_contract_scanner.py'
      - 'buy_only_mail_templates.py'
      - '.github/workflows/scan.yml'
      - '.github/workflows/multi-value-trial.yml'

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run independent multi-item value engine
        env:
          MULTI_MIN_TYPES: '2'
          MULTI_MIN_CONTRACT_PRICE: '1000000'
          MULTI_MAX_CONTRACT_PRICE: '5000000000'
          MULTI_MIN_HOURS_TO_EXPIRE: '0.5'
          MULTI_LIVE_LIMIT: '300'
          MULTI_PER_METRIC: '120'
          MULTI_NEWEST_COUNT: '60'
          MULTI_INSTANT_MIN_PROFIT: '30000000'
          MULTI_INSTANT_MIN_ROI: '0.10'
          MULTI_CASH_FLOOR_MIN_PROFIT: '30000000'
          MULTI_CASH_FLOOR_MIN_ROI: '0.10'
          MULTI_SAFE_PRICE_CHANGE_PCT: '0.15'
          DEAL_SKIN_MAJOR_SHARE: '0.50'
          DEAL_HAUL_BASE_ISK: '2000000'
          DEAL_HAUL_ISK_PER_M3_JUMP: '200'
          DEAL_FRIENDLY_CHARACTER_ID: '2124493042'
          DEAL_FRIENDLY_ALLIANCE_IDS: ''
          DEAL_FRIENDLY_REGION_IDS: ''
        run: python multi_item_contract_scanner.py

      - name: Print trial summary
        shell: bash
        run: |
          echo '===== REPORT ====='
          cat results/latest/multi_item_value_report.md || true
          echo '===== TOP CSV ====='
          python - <<'PY'
          import pandas as pd
          p='results/latest/multi_item_contract_deals.csv'
          try:
              df=pd.read_csv(p)
          except Exception:
              df=pd.DataFrame()
          if df.empty:
              print('NO OPPORTUNITIES')
          else:
              cols=[c for c in [
                  'contract_id','deal_class','execution_status','score_grade',
                  'contract_price','chosen_value_gap','chosen_roi',
                  'buy_unit_coverage','unvalued_units_zero','item_type_count',
                  'system_name','risk_tier'
              ] if c in df.columns]
              print(df[cols].head(30).to_string(index=False))
          PY
