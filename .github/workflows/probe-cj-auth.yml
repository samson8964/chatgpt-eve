name: Inspect C-J6MT authorization

on:
  push:
    paths:
      - '.github/workflows/probe-cj-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect bound C-J character and market access
        env:
          EVE_MARKET_API_KEY: ${{ secrets.EVE_MAIL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Worker status ==="
          curl -fsS https://eve-contract-opener.99617224.workers.dev/ |             sed -n '/C-J6MT市场授权/p' | sed -E 's/<[^>]+>/ /g' | tr -s ' '
          echo
          echo "=== C-J market probe ==="
          code=$(curl -sS -o /tmp/cj.json -w '%{http_code}'             -H "Authorization: Bearer $EVE_MARKET_API_KEY"             "https://eve-contract-opener.99617224.workers.dev/api/structure-market?structure_id=1049588174021&page=1&auth_profile=cj")
          echo "HTTP=$code"
          cat /tmp/cj.json
          echo
          test "$code" = "200"
