name: Opportunity Engine V2 tests

on:
  workflow_dispatch:
  push:
    branches:
      - opportunity-engine-v2
    paths:
      - 'opportunity_engine_v2.py'
      - 'bpc_opportunity_engine_v2.py'
      - 'test_opportunity_engine_v2.py'
      - 'test_bpc_opportunity_engine_v2.py'
      - '.github/workflows/opportunity-engine-v2-test.yml'

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: opportunity-engine-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V2 unit tests
        run: python -m unittest -v test_opportunity_engine_v2.py test_bpc_opportunity_engine_v2.py

      - name: Run BPC V2 live smoke revalidation
        env:
          BPC_V2_LIVE_POOL: '5'
          BPC_V2_LIVE_WORKERS: '6'
          BPC_V2_MIN_NET_PROFIT: '20000000'
          BPC_V2_MIN_NET_ROI: '0.10'
          BPC_V2_MAX_SLIPPAGE: '0.05'
          BPC_V2_MAX_CHANGE: '0.15'
        run: python bpc_opportunity_engine_v2.py

      - name: Show V2 smoke summary
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for p in [Path('results/latest/ranked_opportunities_v2.csv'), Path('results/latest/bpc_value_opportunities_v2.csv')]:
              print(f'--- {p} ---')
              if not p.exists():
                  print('missing')
                  continue
              try:
                  df = pd.read_csv(p)
              except Exception as e:
                  print('read error', e)
                  continue
              print('rows=', len(df))
              if 'v2_status' in df:
                  print(df['v2_status'].value_counts(dropna=False).to_dict())
                  cols=[c for c in ['contract_id','products','v2_status','v2_grade','v2_score','v2_live_net_profit','v2_live_net_roi','v2_stress_net_profit','v2_product_slippage','v2_material_max_slippage','v2_est_fill_days'] if c in df]
                  print(df[cols].head(10).to_string(index=False))
              if 'v2_value_status' in df:
                  print(df['v2_value_status'].value_counts(dropna=False).to_dict())
                  cols=[c for c in ['contract_id','blueprint_name','v2_value_status','v2_value_score','v2_value_confidence','bpc_intrinsic_value_surplus'] if c in df]
                  print(df[cols].head(10).to_string(index=False))
          PY

      - name: Upload V2 smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-engine-v2-smoke
          path: |
            results/latest/ranked_opportunities_v2.csv
            results/latest/bpc_value_opportunities_v2.csv
          if-no-files-found: warn
